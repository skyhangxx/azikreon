<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Тест AKIZ Lingua для определения уровня разговорного корейского.">
  <meta name="theme-color" content="#f7f3eb">
  <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
  <title>Тест на уровень | AKIZ Lingua</title>
  <link rel="stylesheet" href="../assets/css/reset.css">
  <link rel="stylesheet" href="../assets/css/main.css?v=20260910-menu-three">
  <link rel="stylesheet" href="../assets/css/pages.css">
  <link rel="stylesheet" href="/assets/css/structure.css?v=20260913-layout"><link rel="stylesheet" href="/assets/css/zip.css">
  <script src="/assets/js/layout.js?v=20260910-menu-three" defer></script>
  <script src="../assets/js/main.js" defer></script>
  <script src="../assets/js/test-config.js" defer></script>
  <script src="/assets/js/test-engine.js" defer></script>
  <script src="../assets/js/test.js" defer></script>
  <link rel="stylesheet" href="/assets/css/mobile.css?v=20260910-sakura-restored">
</head>
<body class="inner-page">
  <a class="skip-link" href="#main-content">Перейти к содержимому</a>
  <header data-shared-header></header>
  <main class="test-page" id="main-content">
    <section class="test-shell" aria-labelledby="test-title" data-test>
      <div class="test-progress__meta"><span class="test-question-number" data-question-number aria-hidden="true">1</span><span data-progress-label>Вопрос 1 из 15</span><span class="sr-only" data-progress-percent>7%</span></div>
      <div class="test-progress" role="progressbar" aria-valuemin="1" aria-valuemax="15" aria-valuenow="1" data-progress><span data-progress-fill></span></div>
      <p class="test-shell__context" data-question-context></p>
      <p class="test-shell__korean" data-question-korean lang="ko"></p>
      <h1 id="test-title" tabindex="-1" data-question></h1>
      <form data-question-form>
        <fieldset><legend class="sr-only">Выбери один ответ</legend><div class="answer-list" data-answers></div></fieldset>
        <div class="test-controls">
          <button class="button button--secondary" type="button" data-back>Назад</button>
          <button class="button button--primary" type="submit" data-next disabled>Следующий вопрос <span aria-hidden="true">→</span></button>
        </div>
      </form>
    </section>
  </main>
  <footer data-shared-footer></footer>
</body>
</html>
