<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Персональный результат теста AKIZ Lingua.">
  <meta name="theme-color" content="#f7f3eb">
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
  <title>Результат теста | AKIZ Lingua</title>
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/main.css?v=20260910-menu-three">
  <link rel="stylesheet" href="/assets/css/pages.css">
  <link rel="stylesheet" href="/assets/css/structure.css?v=20260913-layout"><link rel="stylesheet" href="/assets/css/zip.css?v=20260912-result-art">
  <script src="/assets/js/layout.js?v=20260910-menu-three" defer></script>
  <script src="/assets/js/main.js" defer></script>
  <script src="/assets/js/test-config.js" defer></script>
  <script src="/assets/js/test-engine.js" defer></script>
  <script src="/assets/js/result.js?v=20260912-result-art" defer></script>
  <link rel="stylesheet" href="/assets/css/mobile.css?v=20260910-sakura-restored">
</head>
<body class="inner-page">
  <a class="skip-link" href="#main-content">Перейти к содержимому</a>
  <header data-shared-header></header>
  <main id="main-content">
    <section class="result-section" data-result-page>
      <div class="container">
        <div class="result-empty" data-result-empty hidden>
          <h1>Сначала пройди короткий тест</h1><p>После ответов здесь появится персональная рекомендация.</p><a class="button button--primary" href="/test">Начать тест <span aria-hidden="true">→</span></a>
        </div>
        <div class="result-layout" data-result-content hidden>
          <div class="result-dial" data-result-dial role="img">
            <div class="result-dial__face">
              <img class="result-dial__art" data-result-image alt="" aria-hidden="true">
              <span><strong data-result-score></strong><small>из 15</small></span>
            </div>
          </div>
          <div class="result-copy">
            <p class="result-copy__eyebrow">Ваш уровень</p>
            <h1><span data-result-title></span> <span class="result-copy__level" lang="ko">(<span data-result-level></span>)</span></h1>
            <div class="result-copy__description" data-result-description hidden></div>
            <a class="button button--primary" href="/application" data-application-source="website_test">Начать обучение <span aria-hidden="true">→</span></a>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer data-shared-footer></footer>
</body>
</html>
